<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal Guide | PGMO OJT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pgmo-green: #0b6b32;
            --pgmo-green-2: #138a43;
            --pgmo-dark: #063f1e;
            --pgmo-light: #eaf8ef;
            --pgmo-border: #cce8d4;
            --text-main: #061322;
            --text-muted: #617089;
            --card-bg: rgba(255, 255, 255, 0.94);
            --soft-shadow: 0 18px 45px rgba(3, 57, 24, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            font-family: "Poppins", Arial, sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at top left, rgba(11, 107, 50, 0.16), transparent 34%),
                radial-gradient(circle at bottom right, rgba(108, 174, 102, 0.14), transparent 30%),
                linear-gradient(135deg, #f7fff9 0%, #ffffff 48%, #edf8f0 100%);
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        .guide-page {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            padding: clamp(10px, 2vw, 22px);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: clamp(10px, 1.4vw, 16px);
        }

        .guide-header {
            width: min(1280px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 14px;
            padding: clamp(12px, 1.7vw, 18px) clamp(14px, 2vw, 22px);
            border: 1px solid var(--pgmo-border);
            border-radius: clamp(18px, 2vw, 24px);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--soft-shadow);
            backdrop-filter: blur(10px);
        }

        .guide-title {
            min-width: 0;
        }

        .guide-title h1 {
            margin: 0;
            font-size: clamp(1.12rem, 2.2vw, 1.75rem);
            color: var(--pgmo-dark);
            line-height: 1.15;
            letter-spacing: -0.03em;
        }

        .guide-title p {
            margin: 5px 0 0;
            color: var(--text-muted);
            font-size: clamp(0.78rem, 1.2vw, 0.95rem);
            line-height: 1.45;
        }

        .guide-badge {
            justify-self: end;
            padding: 9px 14px;
            border-radius: 999px;
            color: var(--pgmo-green);
            background: var(--pgmo-light);
            font-weight: 800;
            font-size: 0.9rem;
            border: 1px solid var(--pgmo-border);
            white-space: nowrap;
        }

        .guide-shell {
            width: min(1280px, 100%);
            min-height: 0;
            margin: 0 auto;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: clamp(10px, 1.4vw, 16px);
        }

        .guide-card {
            min-height: 0;
            height: clamp(420px, calc(100svh - 236px), 760px);
            border-radius: clamp(18px, 2.4vw, 28px);
            border: 1px solid var(--pgmo-border);
            background: var(--card-bg);
            box-shadow: 0 20px 55px rgba(3, 57, 24, 0.12);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(6px, 1vw, 12px);
        }

        .guide-image {
            display: none;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: center;
            border-radius: clamp(12px, 1.7vw, 20px);
            background: #fff;
            user-select: none;
            -webkit-user-drag: none;
        }

        .guide-image.active {
            display: block;
            animation: guideFade 0.22s ease both;
        }

        .guide-controls {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 14px;
            padding: clamp(10px, 1.4vw, 15px) clamp(12px, 1.8vw, 18px);
            border: 1px solid var(--pgmo-border);
            border-radius: clamp(18px, 2vw, 24px);
            background: rgba(255, 255, 255, 0.94);
            box-shadow: var(--soft-shadow);
        }

        .guide-counter {
            color: var(--text-muted);
            font-weight: 700;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .guide-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 88px;
        }

        .guide-dot {
            width: 11px;
            height: 11px;
            border-radius: 999px;
            border: 0;
            background: #c8d5cf;
            cursor: pointer;
            padding: 0;
            transition: width 0.2s ease, background 0.2s ease, transform 0.2s ease;
        }

        .guide-dot.active {
            width: 34px;
            background: var(--pgmo-green);
        }

        .guide-dot:hover {
            transform: translateY(-1px);
        }

        .guide-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .guide-btn {
            border: 0;
            border-radius: 14px;
            padding: 12px 18px;
            font: inherit;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            line-height: 1.1;
            white-space: nowrap;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .guide-btn.secondary {
            color: var(--pgmo-green);
            background: var(--pgmo-light);
            border: 1px solid var(--pgmo-border);
        }

        .guide-btn.primary {
            color: #fff;
            background: linear-gradient(135deg, var(--pgmo-green), var(--pgmo-green-2));
            box-shadow: 0 12px 24px rgba(11, 107, 50, 0.2);
        }

        .guide-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .guide-btn:focus-visible,
        .guide-dot:focus-visible {
            outline: 3px solid rgba(11, 107, 50, 0.25);
            outline-offset: 3px;
        }

        .guide-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes guideFade {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.995);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 900px) {
            .guide-card {
                height: clamp(330px, calc(100svh - 218px), 680px);
            }
        }

        @media (max-width: 720px) {
            .guide-page {
                padding: 10px;
                gap: 10px;
            }

            .guide-header {
                display: flex;
                align-items: flex-start;
                flex-direction: column;
                gap: 9px;
                padding: 12px 14px;
                border-radius: 18px;
            }

            .guide-title h1 {
                font-size: clamp(1rem, 5vw, 1.28rem);
            }

            .guide-title p {
                font-size: 0.78rem;
            }

            .guide-badge {
                font-size: 0.76rem;
                padding: 7px 11px;
            }

            .guide-card {
                height: auto;
                min-height: 0;
                padding: 6px;
                border-radius: 18px;
            }

            .guide-image {
                height: auto;
                max-height: none;
                border-radius: 12px;
            }

            .guide-controls {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 10px;
                border-radius: 18px;
            }

            .guide-counter {
                order: 2;
                text-align: center;
                font-size: 0.82rem;
            }

            .guide-dots {
                order: 1;
            }

            .guide-actions {
                order: 3;
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .guide-btn {
                width: 100%;
                min-height: 44px;
                padding: 10px 12px;
                font-size: 0.82rem;
            }
        }

        @media (max-width: 420px) {
            .guide-page {
                padding: 8px;
            }

            .guide-card {
                height: auto;
            }

            .guide-actions {
                grid-template-columns: 1fr;
            }

            .guide-btn {
                white-space: normal;
            }
        }

        @media (max-height: 560px) and (orientation: landscape) {
            .guide-page {
                padding: 8px;
                gap: 8px;
            }

            .guide-header {
                grid-template-columns: minmax(0, 1fr) auto;
                padding: 8px 12px;
                border-radius: 16px;
            }

            .guide-title h1 {
                font-size: 1rem;
            }

            .guide-title p {
                display: none;
            }

            .guide-badge {
                font-size: 0.72rem;
                padding: 6px 10px;
            }

            .guide-card {
                height: calc(100svh - 128px);
                min-height: 190px;
                padding: 5px;
            }

            .guide-image {
                height: 100%;
                max-height: 100%;
            }

            .guide-controls {
                grid-template-columns: auto 1fr auto;
                padding: 8px;
                gap: 8px;
            }

            .guide-btn {
                min-height: 38px;
                padding: 8px 12px;
                font-size: 0.78rem;
            }
        }


        /* PGMO PATCH 2026-07-06: softer guide motion */
        @keyframes guideHeaderDrop {
            from {
                opacity: 0;
                transform: translateY(-14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes guideCardRise {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.985);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes guideButtonGlow {
            0%, 100% {
                box-shadow: 0 12px 24px rgba(11, 107, 50, 0.20);
            }
            50% {
                box-shadow: 0 18px 34px rgba(11, 107, 50, 0.32);
            }
        }

        @keyframes guideDotPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }

        @media (prefers-reduced-motion: no-preference) {
            .guide-header {
                animation: guideHeaderDrop 0.45s ease both;
            }

            .guide-card {
                animation: guideCardRise 0.55s ease both;
                animation-delay: 0.08s;
            }

            .guide-controls {
                animation: guideCardRise 0.5s ease both;
                animation-delay: 0.16s;
            }

            .guide-btn.primary:not(:disabled) {
                animation: guideButtonGlow 2.4s ease-in-out infinite;
            }

            .guide-dot.active {
                animation: guideDotPulse 1.3s ease-in-out infinite;
            }
        }

        @media (max-width: 720px) and (prefers-reduced-motion: no-preference) {
            .guide-image.active {
                animation-duration: 0.28s;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .guide-header,
            .guide-card,
            .guide-controls,
            .guide-btn.primary:not(:disabled),
            .guide-dot.active,
            .guide-image.active {
                animation: none !important;
                transform: none !important;
                filter: none !important;
            }
        }

    </style>
</head>
<body>
    <main class="guide-page">
        <header class="guide-header">
            <div class="guide-title">
                <h1>PGMO Student Portal Guide</h1>
                <p>Read the guide first. After the last page, continue to secure registration.</p>
            </div>
            <div class="guide-badge" id="guideBadge">Page 1 of 3</div>
        </header>

        <section class="guide-shell" aria-label="Student portal guide slides">
            <div class="guide-card">
                <img class="guide-image active" src="assets/img/guide/page-1-ojt-guide.png" fetchpriority="high" decoding="async" draggable="false" alt="Guide page 1: Register, sign in, dashboard, and profile" />
                <img class="guide-image" src="assets/img/guide/page-2-ojt-guide.png" loading="lazy" decoding="async" draggable="false" alt="Guide page 2: Upload documents, submissions, and daily time record" />
                <img class="guide-image" src="assets/img/guide/page-3-ojt-guide.png" loading="lazy" decoding="async" draggable="false" alt="Guide page 3: Requirements, notifications, and reminders" />
            </div>

            <div class="guide-controls">
                <span class="guide-counter" id="guideCounter">Page 1 of 3</span>
                <div class="guide-dots" aria-label="Guide page selector">
                    <button class="guide-dot active" type="button" aria-label="Open guide page 1" data-guide-dot="0"></button>
                    <button class="guide-dot" type="button" aria-label="Open guide page 2" data-guide-dot="1"></button>
                    <button class="guide-dot" type="button" aria-label="Open guide page 3" data-guide-dot="2"></button>
                </div>
                <div class="guide-actions">
                    <button class="guide-btn secondary" type="button" id="prevGuideBtn">Back</button>
                    <button class="guide-btn primary" type="button" id="nextGuideBtn">Next</button>
                    <a class="guide-btn primary" href="secure-register.html" id="registerGuideBtn" style="display: none;">Continue to Registration</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function(){
            const slides = Array.from(document.querySelectorAll(".guide-image"));
            const dots = Array.from(document.querySelectorAll(".guide-dot"));
            const counter = document.getElementById("guideCounter");
            const badge = document.getElementById("guideBadge");
            const prev = document.getElementById("prevGuideBtn");
            const next = document.getElementById("nextGuideBtn");
            const register = document.getElementById("registerGuideBtn");
            let current = 0;

            function showSlide(index){
                current = Math.max(0, Math.min(index, slides.length - 1));
                slides.forEach((slide, slideIndex) => slide.classList.toggle("active", slideIndex === current));
                dots.forEach((dot, dotIndex) => dot.classList.toggle("active", dotIndex === current));
                const label = `Page ${current + 1} of ${slides.length}`;
                counter.textContent = label;
                badge.textContent = label;
                prev.disabled = current === 0;
                next.style.display = current === slides.length - 1 ? "none" : "inline-flex";
                register.style.display = current === slides.length - 1 ? "inline-flex" : "none";
            }

            prev.addEventListener("click", () => showSlide(current - 1));
            next.addEventListener("click", () => showSlide(current + 1));
            dots.forEach((dot) => {
                dot.addEventListener("click", () => showSlide(Number(dot.dataset.guideDot || 0)));
            });
            register.addEventListener("click", () => {
                try { localStorage.setItem("pgmoStudentGuideRead", new Date().toISOString()); } catch(e) {}
            });

            document.addEventListener("keydown", (event) => {
                if(event.key === "ArrowLeft") showSlide(current - 1);
                if(event.key === "ArrowRight") showSlide(current + 1);
            });

            let touchStartX = 0;
            let touchStartY = 0;
            const guideCard = document.querySelector(".guide-card");

            guideCard.addEventListener("touchstart", (event) => {
                const touch = event.changedTouches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }, { passive: true });

            guideCard.addEventListener("touchend", (event) => {
                const touch = event.changedTouches[0];
                const diffX = touch.clientX - touchStartX;
                const diffY = touch.clientY - touchStartY;

                if(Math.abs(diffX) > 48 && Math.abs(diffX) > Math.abs(diffY)){
                    showSlide(current + (diffX < 0 ? 1 : -1));
                }
            }, { passive: true });

            showSlide(0);
        })();
    </script>
</body>
</html>

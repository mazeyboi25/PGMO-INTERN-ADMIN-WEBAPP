<!DOCTYPE html>
    <html lang="en">
    <head>
    <title>My Submissions | PGMO Student Portal</title>
    <link rel="icon" type="image/png" href="assets/img/studentlogo.png">
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <body class="portal-body" data-page="submissions">
<div class="mobile-topbar">
    <button type="button" id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open menu">
        <i class="fa fa-bars"></i>
        <span>Menu</span>
    </button>
</div>
    <aside class="portal-sidebar">
    <div class="portal-logo">
        <img src="assets/img/pgmoseal.png" alt="PGMO Seal">
        <div>
            <strong>PGMO</strong>
            <small>OJT/Work Immersion</small>
            <span>Student Portal</span>
        </div>
    </div>

    <nav class="portal-menu">
    <a href="dashboard.html" class="">
        <i class="fa fa-house"></i> Dashboard
        
    </a>
    <a href="profile.html" class="">
        <i class="fa fa-user"></i> My Profile
        
    </a>
    <a href="upload.html" class="">
        <i class="fa fa-cloud-arrow-up"></i> Upload Documents
        
    </a>
    <a href="submissions.html" class="active">
        <i class="fa fa-file-lines"></i> My Submissions
        
    </a>
    <a href="dtr.html" class="">
        <i class="fa fa-calendar-days"></i> DTR
        
    </a>
    <a href="requirements.html" class="">
        <i class="fa fa-list-check"></i> OJT Requirements
        
    </a>
        <a href="id-request.html" class="">
        <i class="fa fa-id-card"></i> OJT ID Request
        
    </a>
<a href="notifications.html" class="">
        <i class="fa fa-bell"></i> Notifications
        <span id="notificationBadge" aria-live="polite"></span>
    </a>
    <a href="help.html" class="">
        <i class="fa fa-circle-question"></i> Help & Support
        
    </a>
    </nav>

    <div class="student-mini">
        <div class="mini-avatar">
            <i class="fa fa-user"></i>
        </div>

        <div>
            <strong id="miniStudentName">Student</strong>
            <small id="miniStudentId">STU-000</small>
        </div>
    </div>

    <button type="button" id="logoutButton" class="sidebar-logout">
        <i class="fa fa-right-from-bracket"></i> Log Out
    </button>
</aside>

    <main class="portal-main">
        <header class="portal-top">
            <div>
                <h1>My Submissions</h1>
                <p id="studentDetailsDisplay">Your OJT student portal is ready.</p>
            </div>

            <div class="top-actions">
                <button type="button" class="top-icon" aria-haspopup="true" aria-expanded="false" aria-label="Open notifications">
                    <i class="fa fa-bell"></i>
                    <span id="topNotificationDot"></span>
                </button>

                <div class="top-avatar">
                    <i class="fa fa-user"></i>
                </div>
            </div>
        </header>

        <section class="dash-card upload-list-card">
    <div class="card-title">
        <div>
            <h3>My Uploaded Documents</h3>
            <p>Your submitted documents will appear here.</p>
        </div>
    </div>

    <div class="tab-row">
        <button type="button" class="active" data-filter="All">All Documents</button>
        <button type="button" data-filter="Pending">Pending</button>
        <button type="button" data-filter="Approved">Approved</button>
        <button type="button" data-filter="Returned">Returned</button>
    </div>

    <div id="studentFiles" class="uploaded-list"></div>
</section>

    </main>

    <div id="toastBox" class="toast-box"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

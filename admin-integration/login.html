<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | InternTrack</title>
<link rel="icon" type="image/png" href="assets/img/adminlogo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=login-student-gradient-buttons-20260703">
</head>

<body class="login-body" data-page="login">

<div class="login-layout">

    <div class="login-panel">

        <div class="login-brand">
            <img src="assets/img/pgmoseal1.png" alt="PGMO Seal">
            <div>
                <h1>Intern<span>Track</span></h1>
                <p>OJT Admin System</p>
            </div>
        </div>

        <form id="loginForm" class="login-form">

            <div class="error-message" id="errorMessage"></div>

            <label class="form-label">Username</label>
            <div class="login-input">
                <i class="fa fa-user"></i>
                <input id="username" type="text" placeholder="Enter username" autocomplete="username">
            </div>

            <label class="form-label">Password</label>
            <div class="login-input">
                <i class="fa fa-lock"></i>
                <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
                <button type="button" onclick="togglePassword()" aria-label="Show or hide password" title="Show or hide password">
                    <i class="fa fa-eye" id="eyeIcon"></i>
                </button>
            </div>

            <button type="submit" class="login-button">
                <i class="fa fa-right-to-bracket"></i> Log in
            </button>


        </form>

    </div>

    <div class="login-visual">

        <div class="visual-overlay"></div>

        <div class="visual-content">
            <h2>PROVINCIAL GOVERNMENT OF MISAMIS ORIENTAL</h2>
            <p>OJT Monitoring and Document Management Portal</p>

            <div class="visual-tags">
                <span>Students</span>
                <span>Applications</span>
                <span>Documents</span>
                <span>Certificates</span>
                <span>Reports</span>
            </div>
        </div>

    </div>

</div>

<script src="assets/js/config.local.js"></script>
<script src="assets/js/admin-auth.js?v=admin-polish-v2"></script>
<script>
function showLoginMessage(message, type="error"){
    const box = document.getElementById("errorMessage");
    box.textContent = message;
    box.style.display = "block";
    box.style.background = type === "success" ? "#dcfce7" : "#fee2e2";
    box.style.color = type === "success" ? "#166534" : "#991b1b";
}

document.addEventListener("DOMContentLoaded", function(){
    clearAdminSession();
    seedAdminAccounts();

    if(getAdminAccounts().length === 0){
        showLoginMessage("Admin login is not configured. Set the private values in assets/js/config.local.js before signing in.", "error");
    }

    const expiredMsg = sessionStorage.getItem("admin_session_expired");

    if(expiredMsg){
        showLoginMessage(expiredMsg, "error");
        sessionStorage.removeItem("admin_session_expired");
    }
});

document.getElementById("loginForm").addEventListener("submit", async function(event){
    event.preventDefault();

    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value.trim();

    if(!username || !password){
        showLoginMessage("Please enter your username and password.");
        return;
    }

    const accounts = getAdminAccounts();
    const account = accounts.find(item => {
        const savedUsername = String(item.username || "").toLowerCase();
        const savedEmail = String(item.email || "").toLowerCase();
        return savedUsername === username || savedEmail === username;
    });
    const passwordHash = await hashAdminPassword(password);

    if(!account || account.passwordHash !== passwordHash){
        showLoginMessage("Invalid username or password.");
        return;
    }

    setAdminSession(account);
    window.location.href = "index.html";
});

function togglePassword(){
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    if(passwordInput.type === "password"){
        passwordInput.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
    }else{
        passwordInput.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
    }
}
</script>

</body>
</html>
